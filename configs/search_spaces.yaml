# Optuna search spaces. type: float | int | cat ; log: true for log-uniform.
LogisticRegression:
  C: {type: float, low: 0.001, high: 100, log: true}
RandomForest:
  n_estimators: {type: int, low: 100, high: 500, step: 100}
  max_depth: {type: int, low: 2, high: 16}
  min_samples_leaf: {type: int, low: 1, high: 20, log: true}
  max_features: {type: float, low: 0.2, high: 1.0}
XGBoost:
  n_estimators: {type: int, low: 50, high: 600, step: 50}
  learning_rate: {type: float, low: 0.01, high: 0.3, log: true}
  max_depth: {type: int, low: 2, high: 8}
  min_child_weight: {type: float, low: 1, high: 20, log: true}
  subsample: {type: float, low: 0.5, high: 1.0}
  colsample_bytree: {type: float, low: 0.4, high: 1.0}
  reg_lambda: {type: float, low: 0.001, high: 10, log: true}
LightGBM:
  n_estimators: {type: int, low: 50, high: 600, step: 50}
  learning_rate: {type: float, low: 0.01, high: 0.3, log: true}
  num_leaves: {type: int, low: 4, high: 64, log: true}
  min_child_samples: {type: int, low: 5, high: 60, log: true}
  subsample: {type: float, low: 0.5, high: 1.0}
  colsample_bytree: {type: float, low: 0.4, high: 1.0}
  reg_lambda: {type: float, low: 0.001, high: 10, log: true}
CatBoost:
  iterations: {type: int, low: 100, high: 600, step: 100}
  learning_rate: {type: float, low: 0.02, high: 0.3, log: true}
  depth: {type: int, low: 3, high: 8}
  l2_leaf_reg: {type: float, low: 1, high: 10, log: true}
# TabPFN and EBM are used with default settings (not tuned).
